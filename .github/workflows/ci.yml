name: CI

on:
  push:
    branches:
      - main
      - rewrite/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Syntax checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
