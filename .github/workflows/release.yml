name: Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/releases/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Syntax checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(sed -nE 's/^version = "([^"]+)"$/\1/p' src-tauri/Cargo.toml | head -1)"
          test "$VERSION" = "$TAURI_VERSION"
          test "$VERSION" = "$CARGO_VERSION"
          test -f ".github/releases/v${VERSION}.md"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Bundle Windows installer
        run: npm run desktop:build

      - name: Publish Windows release with installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          shopt -s nullglob
          installers=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected exactly one Windows NSIS installer" >&2
            exit 1
          fi

          installer="${installers[0]}"
          (cd "$(dirname "$installer")" && sha256sum "$(basename "$installer")") > SHA256SUMS.txt

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$installer" SHA256SUMS.txt --clobber
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" "$installer" SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Mote $TAG" \
              --notes-file ".github/releases/${TAG}.md" \
              "${flags[@]}"
          fi
